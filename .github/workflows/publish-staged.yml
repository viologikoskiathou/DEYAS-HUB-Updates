name: Publish staged Android APK
on:
  push:
    branches: [main]
    paths: [release-request.json]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deyas-public-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Validate request and download APK from signed artifact archive
        shell: bash
        run: |
          python3 - <<'PY'
          import json, re, urllib.request, zipfile, hashlib
          from pathlib import Path
          d = json.loads(Path('release-request.json').read_text())
          name,version,url = d['fileName'], d['versionName'], d['artifactUrl']
          build=d['versionCode']
          if not (re.fullmatch(r'0[.]\d+[.]\d+',version)
                  and isinstance(build,int) and build>0
                  and name==f'DEYAS-HUB-{version}-arm64.apk'
                  and isinstance(url,str) and url.startswith('https://sdmnt')):
              raise SystemExit('Invalid request')
          with urllib.request.urlopen(url, timeout=120) as resp:
              raw=resp.read(100*1024*1024+1)
          if len(raw)>100*1024*1024 or len(raw)<10*1024*1024:
              raise SystemExit('Unexpected archive size')
          from io import BytesIO
          with zipfile.ZipFile(BytesIO(raw)) as archive:
              names=[n for n in archive.namelist() if n.endswith('.apk') and '/' not in n]
              if len(names)!=1:
                  raise SystemExit('Archive must contain exactly one top-level APK')
              apk=archive.read(names[0])
          if len(apk)<40*1024*1024 or len(apk)>100*1024*1024:
              raise SystemExit('Unexpected APK size')
          Path(name).write_bytes(apk)
          sha=hashlib.sha256(apk).hexdigest()
          data={'versionCode':build,'versionName':version,
                'apkUrl':f'https://github.com/viologikoskiathou/DEYAS-HUB-Updates/releases/download/v{version}/{name}',
                'sha256':sha,'notes':d.get('notes','Νέα έκδοση της εφαρμογής.')}
          Path('latest.json').write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n')
          Path('/tmp/release-version').write_text(version)
          Path('/tmp/release-filename').write_text(name)
          print('Verified APK SHA256:',sha)
          PY
      - name: Publish release and current-version manifest
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          VERSION="$(cat /tmp/release-version)"
          FILE="$(cat /tmp/release-filename)"
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release already exists; refusing to overwrite immutable APK"
            exit 1
          fi
          gh release create "v$VERSION" "./$FILE" --repo "$GITHUB_REPOSITORY" --title "DEYAS HUB $VERSION" --notes "Android ARM64 update. User-confirmed APK installation." --latest
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add latest.json
          git commit -m "Publish Android update metadata for $VERSION [skip ci]"
          git push
